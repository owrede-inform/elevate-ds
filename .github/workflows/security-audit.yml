name: Security Audit

on:
  schedule:
    # Run security audit daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'scripts/npm-security-check.js'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'scripts/npm-security-check.js'

permissions:
  contents: read
  security-events: write

jobs:
  security-audit:
    runs-on: ubuntu-latest
    name: Comprehensive Security Audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ELEVATE_DS2 }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'

      - name: Configure npm for GitHub Packages
        run: |
          echo "@inform-elevate:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.ELEVATE_DS2 }}" >> .npmrc

      - name: Install security tools
        run: |
          echo "🛡️ Installing security scanning tools..."
          # Try to install npq
          npm install -g npq || echo "npq installation failed, using alternative"

          # Install other security tools
          npm install -g audit-ci || echo "audit-ci installation failed"
          npm install -g better-npm-audit || echo "better-npm-audit installation failed"

          echo "Installed security tools:"
          npq --version || echo "npq: not available"
          audit-ci --version || echo "audit-ci: not available"
          better-npm-audit --version || echo "better-npm-audit: not available"

      - name: Pre-installation security scan
        run: |
          echo "🔍 Running pre-installation security analysis..."

          # Check for known malicious packages in package.json
          echo "Checking for known compromised packages..."
          if grep -E "command-exists|gpmm-test|@wokd/wokd-js|test-json-package-14|geeeks|e5f2d5e1c7|@zumry/zumry-js" package.json package-lock.json; then
            echo "🚨 CRITICAL: Known compromised package detected!"
            exit 1
          else
            echo "✅ No known compromised packages found"
          fi

          # Run our custom security check
          node scripts/npm-security-check.js --pre-install

      - name: Install dependencies with security monitoring
        run: |
          echo "🛡️ Installing dependencies with security monitoring..."

          # Use npq if available, otherwise use npm ci with monitoring
          if command -v npq >/dev/null 2>&1; then
            echo "Using npq for secure installation"
            npq install
          else
            echo "Using npm ci with security monitoring"
            npm ci --audit
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ELEVATE_DS2 }}

      - name: Comprehensive security audit
        run: |
          echo "🔍 Running comprehensive security audit..."

          # Run our custom security scanner
          echo "1. Custom Security Scanner:"
          npm run security:check

          # Run npm audit
          echo "2. NPM Audit:"
          npm audit --audit-level moderate || echo "npm audit found issues"

          # Run better-npm-audit if available
          if command -v better-npm-audit >/dev/null 2>&1; then
            echo "3. Better NPM Audit:"
            better-npm-audit audit || echo "better-npm-audit found issues"
          fi

          # Run audit-ci if available
          if command -v audit-ci >/dev/null 2>&1; then
            echo "4. Audit CI:"
            audit-ci --moderate || echo "audit-ci found moderate+ issues"
          fi

      - name: Check for dependency vulnerabilities
        run: |
          echo "🔍 Checking for known vulnerabilities in dependencies..."

          # Check for packages with known security issues
          if npm ls --parseable | grep -E "node_modules/(event-stream|flatmap-stream|eslint-scope|getcookies)"; then
            echo "🚨 CRITICAL: Package with known security issues detected!"
            exit 1
          fi

          echo "✅ No packages with known critical vulnerabilities found"

      - name: Security report summary
        if: always()
        run: |
          echo "📊 SECURITY AUDIT SUMMARY"
          echo "================================="
          echo "✅ Pre-installation check: Completed"
          echo "✅ Dependencies installed: Securely"
          echo "✅ Custom security scan: Completed"
          echo "✅ Vulnerability check: Completed"
          echo ""
          echo "🛡️ Security measures active:"
          echo "  - ignore-scripts=true (prevents malicious scripts)"
          echo "  - check-integrity=true (verifies package integrity)"
          echo "  - strict-ssl=true (requires SSL verification)"
          echo "  - save-exact=true (prevents version range attacks)"
          echo ""
          echo "For detailed results, check the individual step outputs above."

      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-results
          path: |
            npm-audit.json
            package-lock.json
          retention-days: 30

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC