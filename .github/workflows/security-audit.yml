name: Security Audit

on:
  schedule:
    # Run security audit daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.pnpmrc'
      - 'scripts/pnpm-security-check.js'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.pnpmrc'
      - 'scripts/pnpm-security-check.js'

permissions:
  contents: read
  security-events: write

jobs:
  security-audit:
    runs-on: ubuntu-latest
    name: Comprehensive Security Audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ELEVATE_DS2 }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Configure pnpm for GitHub Packages
        run: |
          echo "@inform-elevate:registry=https://npm.pkg.github.com" >> .pnpmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.ELEVATE_DS2 }}" >> .pnpmrc

      - name: Install security tools
        run: |
          echo "🛡️ Installing security scanning tools..."
          # Use pnpm's built-in security features
          echo "pnpm has built-in security features - no additional tools needed"
          pnpm --version

          echo "Installed security tools:"
          npq --version || echo "npq: not available"
          audit-ci --version || echo "audit-ci: not available"
          # Note: Using pnpm's built-in audit capabilities

      - name: Pre-installation security scan
        run: |
          echo "🔍 Running pre-installation security analysis..."

          # Check for known malicious packages in package.json
          echo "Checking for known compromised packages..."
          if grep -E "command-exists|gpmm-test|@wokd/wokd-js|test-json-package-14|geeeks|e5f2d5e1c7|@zumry/zumry-js" package.json pnpm-lock.yaml; then
            echo "🚨 CRITICAL: Known compromised package detected!"
            exit 1
          else
            echo "✅ No known compromised packages found"
          fi

          # Run our custom security check
          node scripts/pnpm-security-check.js --pre-install

      - name: Install dependencies with security monitoring
        run: |
          echo "🛡️ Installing dependencies with security monitoring..."

          echo "Installing dependencies with pnpm..."
          pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ELEVATE_DS2 }}

      - name: Comprehensive security audit
        run: |
          echo "🔍 Running comprehensive security audit..."

          # Run our custom security scanner
          echo "1. Custom Security Scanner:"
          pnpm security:check

          # Run pnpm audit
          echo "2. PNPM Audit:"
          pnpm audit --audit-level moderate || echo "pnpm audit found issues"

      - name: Check for dependency vulnerabilities
        run: |
          echo "🔍 Checking for known vulnerabilities in dependencies..."

          # Check for packages with known security issues
          if pnpm ls --parseable | grep -E "node_modules/(event-stream|flatmap-stream|eslint-scope|getcookies)"; then
            echo "🚨 CRITICAL: Package with known security issues detected!"
            exit 1
          fi

          echo "✅ No packages with known critical vulnerabilities found"

      - name: Security report summary
        if: always()
        run: |
          echo "📊 SECURITY AUDIT SUMMARY"
          echo "================================="
          echo "✅ Pre-installation check: Completed"
          echo "✅ Dependencies installed: Securely"
          echo "✅ Custom security scan: Completed"
          echo "✅ Vulnerability check: Completed"
          echo ""
          echo "🛡️ Security measures active:"
          echo "  - ignore-scripts=true (prevents malicious scripts)"
          echo "  - check-integrity=true (verifies package integrity)"
          echo "  - strict-ssl=true (requires SSL verification)"
          echo "  - save-exact=true (prevents version range attacks)"
          echo ""
          echo "For detailed results, check the individual step outputs above."

      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-results
          path: |
            pnpm-audit.json
            pnpm-lock.yaml
          retention-days: 30

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC