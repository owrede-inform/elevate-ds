name: Deploy ELEVATE Design System to GitHub Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ELEVATE_DS2 }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Configure pnpm for GitHub Packages
        run: |
          echo "@inform-elevate:registry=https://npm.pkg.github.com" >> .pnpmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.ELEVATE_DS2 }}" >> .pnpmrc

      - name: Install security scanner (pnpm-based)
        run: |
          echo "Using pnpm's built-in audit for security scanning"
          pnpm --version

      - name: Pre-installation security check
        run: |
          echo "🔍 Running pre-installation security check..."
          node scripts/pnpm-security-check.js --pre-install || echo "Custom scanner not available yet"

      - name: Install dependencies with security monitoring
        run: |
          echo "🛡️ Installing dependencies with pnpm..."
          pnpm install --no-frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ELEVATE_DS2 }}

      - name: Post-installation security audit
        run: |
          echo "🔍 Running comprehensive security audit..."
          pnpm security:check
          echo "✅ Security audit completed"

      - name: Build Docusaurus site with search index
        run: |
          # Ensure docusaurus binary is executable
          chmod +x node_modules/.bin/docusaurus || true
          pnpm build:github
        env:
          NODE_ENV: production
          NODE_OPTIONS: "--max-old-space-size=4096"
          DEPLOYMENT_ENV: github-pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.ELEVATE_DS2 }}

  test-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ELEVATE_DS2 }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'

      - name: Configure pnpm for GitHub Packages
        run: |
          echo "@inform-elevate:registry=https://npm.pkg.github.com" >> .pnpmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.ELEVATE_DS2 }}" >> .pnpmrc

      - name: Install security scanner (pnpm-based)
        run: |
          echo "Using pnpm's built-in audit for security scanning"
          pnpm --version

      - name: Pre-installation security check
        run: |
          echo "🔍 Running pre-installation security check..."
          node scripts/pnpm-security-check.js --pre-install || echo "Custom scanner not available yet"

      - name: Install dependencies with security monitoring
        run: |
          echo "🛡️ Installing dependencies with pnpm..."
          pnpm install --no-frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ELEVATE_DS2 }}

      - name: Post-installation security audit
        run: |
          echo "🔍 Running comprehensive security audit..."
          pnpm security:check
          echo "✅ Security audit completed"

      - name: Test build
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Run type checking
        run: pnpm typecheck

      - name: Test serve (smoke test)
        run: |
          pnpm serve &
          SERVER_PID=$!
          sleep 10
          curl -f http://localhost:3000 || exit 1
          kill $SERVER_PID