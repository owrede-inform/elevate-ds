<svg width="320" height="160" viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="160" fill="#f8fafc"/>

  <!-- Mixed unorganized checkboxes without structure -->
  <rect x="40" y="20" width="12" height="12" rx="2" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="60" y="30" fill="#374151" font-family="system-ui" font-size="11">Email notifications</text>

  <rect x="40" y="40" width="12" height="12" rx="2" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="60" y="50" fill="#374151" font-family="system-ui" font-size="11">Dark mode</text>

  <rect x="40" y="60" width="12" height="12" rx="2" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="60" y="70" fill="#374151" font-family="system-ui" font-size="11">Terms and conditions</text>

  <rect x="40" y="80" width="12" height="12" rx="2" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="60" y="90" fill="#374151" font-family="system-ui" font-size="11">SMS alerts</text>

  <rect x="40" y="100" width="12" height="12" rx="2" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="60" y="110" fill="#374151" font-family="system-ui" font-size="11">Auto-save</text>

  <!-- Lines showing confusion about relationships -->
  <path d="M30 35 Q25 50 30 65" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
  <path d="M30 55 Q25 70 30 85" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
  <path d="M30 75 Q25 90 30 105" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>

  <!-- User confusion indicator -->
  <g transform="translate(270, 70)">
    <circle r="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="14" font-weight="bold">!</text>
  </g>

  <!-- Problem indicator -->
  <text x="160" y="140" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="10">Mixed categories without clear organization</text>
</svg>