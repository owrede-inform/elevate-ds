<svg width="320" height="120" viewBox="0 0 320 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="120" fill="#f8fafc"/>

  <!-- Two competing primary buttons with equal visual weight -->
  <rect x="40" y="40" width="100" height="40" rx="6" fill="#3b82f6" stroke="#2563eb" stroke-width="2"/>
  <text x="90" y="63" text-anchor="middle" fill="white" font-family="system-ui" font-size="12" font-weight="600">Save Changes</text>

  <rect x="180" y="40" width="100" height="40" rx="6" fill="#3b82f6" stroke="#2563eb" stroke-width="2"/>
  <text x="230" y="63" text-anchor="middle" fill="white" font-family="system-ui" font-size="12" font-weight="600">Submit Form</text>

  <!-- Visual confusion indicators -->
  <g transform="translate(160, 35)">
    <path d="M-10,0 L10,0 M0,-10 L0,10" stroke="#ef4444" stroke-width="2" opacity="0.7"/>
    <circle r="15" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- User confusion illustration -->
  <text x="160" y="105" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="11">Which action is more important?</text>

  <!-- Arrows showing conflict -->
  <path d="M90,85 Q105,95 120,85" stroke="#ef4444" stroke-width="1.5" fill="none" opacity="0.6" marker-end="url(#arrowhead)"/>
  <path d="M230,85 Q215,95 200,85" stroke="#ef4444" stroke-width="1.5" fill="none" opacity="0.6" marker-end="url(#arrowhead)"/>

  <defs>
    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#ef4444" opacity="0.6"/>
    </marker>
  </defs>
</svg>