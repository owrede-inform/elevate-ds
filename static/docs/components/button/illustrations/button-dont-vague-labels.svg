<svg width="320" height="140" viewBox="0 0 320 140" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="140" fill="#f8fafc"/>

  <!-- Buttons with vague, unhelpful labels -->
  <rect x="60" y="25" width="60" height="35" rx="6" fill="#dc2626" stroke="#b91c1c" stroke-width="1"/>
  <text x="90" y="45" text-anchor="middle" fill="white" font-family="system-ui" font-size="11" font-weight="600">OK</text>

  <rect x="140" y="25" width="60" height="35" rx="6" fill="#22c55e" stroke="#16a34a" stroke-width="1"/>
  <text x="170" y="45" text-anchor="middle" fill="white" font-family="system-ui" font-size="11" font-weight="600">Yes</text>

  <rect x="220" y="25" width="80" height="35" rx="6" fill="#6b7280" stroke="#4b5563" stroke-width="1"/>
  <text x="260" y="45" text-anchor="middle" fill="white" font-family="system-ui" font-size="11" font-weight="600">Click Here</text>

  <!-- Question marks showing user confusion -->
  <text x="90" y="80" text-anchor="middle" fill="#cbd5e1" font-family="system-ui" font-size="16" opacity="0.6">?</text>
  <text x="170" y="80" text-anchor="middle" fill="#cbd5e1" font-family="system-ui" font-size="16" opacity="0.6">?</text>
  <text x="260" y="80" text-anchor="middle" fill="#cbd5e1" font-family="system-ui" font-size="16" opacity="0.6">?</text>

  <!-- User confusion thoughts -->
  <text x="90" y="100" text-anchor="middle" fill="#94a3af" font-family="system-ui" font-size="9">OK to what?</text>
  <text x="170" y="100" text-anchor="middle" fill="#94a3af" font-family="system-ui" font-size="9">Yes to what?</text>
  <text x="260" y="100" text-anchor="middle" fill="#94a3af" font-family="system-ui" font-size="9">Click for what?</text>

  <!-- Bottom indicator showing the problem -->
  <text x="160" y="125" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="11">Labels don't describe what will happen</text>
</svg>