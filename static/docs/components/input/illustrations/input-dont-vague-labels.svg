<svg width="320" height="100" viewBox="0 0 320 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="100" fill="#f8fafc"/>

  <!-- Input field with vague labeling -->
  <rect x="40" y="25" width="240" height="50" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>

  <!-- Vague label -->
  <text x="45" y="20" fill="#374151" font-family="system-ui" font-size="12" font-weight="500">Email</text>

  <!-- Placeholder that doesn't help -->
  <text x="50" y="53" fill="#9ca3af" font-family="system-ui" font-size="12">Email</text>

  <!-- Question marks showing confusion -->
  <text x="290" y="35" text-anchor="middle" fill="#cbd5e1" font-family="system-ui" font-size="14" opacity="0.6">?</text>
  <text x="300" y="65" text-anchor="middle" fill="#cbd5e1" font-family="system-ui" font-size="14" opacity="0.6">?</text>

  <!-- User confusion indicators -->
  <text x="160" y="90" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="10">What kind of email? Work or personal? What format?</text>
</svg>