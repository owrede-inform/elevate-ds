<svg width="320" height="140" viewBox="0 0 320 140" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="140" fill="#f8fafc"/>

  <!-- Title showing the problem -->
  <text x="160" y="15" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="11" font-weight="500">All using generic text input type</text>

  <!-- Multiple inputs all using wrong type="text" -->
  <rect x="40" y="25" width="240" height="20" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="45" y="20" fill="#374151" font-family="system-ui" font-size="10" font-weight="500">Email Address</text>
  <text x="45" y="38" fill="#9ca3af" font-family="system-ui" font-size="10">Enter email</text>

  <rect x="40" y="55" width="240" height="20" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="45" y="50" fill="#374151" font-family="system-ui" font-size="10" font-weight="500">Phone Number</text>
  <text x="45" y="68" fill="#9ca3af" font-family="system-ui" font-size="10">Enter phone</text>

  <rect x="40" y="85" width="240" height="20" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="45" y="80" fill="#374151" font-family="system-ui" font-size="10" font-weight="500">Website URL</text>
  <text x="45" y="98" fill="#9ca3af" font-family="system-ui" font-size="10">Enter URL</text>

  <!-- Mobile keyboard icon showing generic keyboard -->
  <g transform="translate(290, 60)">
    <rect width="25" height="18" rx="2" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <rect x="2" y="2" width="21" height="6" rx="1" fill="#ffffff"/>
    <rect x="2" y="9" width="21" height="7" rx="1" fill="#ffffff"/>
    <text x="12.5" y="13" text-anchor="middle" fill="#9ca3af" font-family="system-ui" font-size="6">ABC</text>
  </g>

  <!-- Problem indicator -->
  <text x="160" y="125" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="10">Missing specialized keyboards and validation</text>
</svg>