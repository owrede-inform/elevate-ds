<svg width="320" height="100" viewBox="0 0 320 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="100" fill="#f8fafc"/>

  <!-- Input field with error state -->
  <rect x="40" y="25" width="240" height="40" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>

  <!-- Label -->
  <text x="45" y="20" fill="#374151" font-family="system-ui" font-size="12" font-weight="500">Password</text>

  <!-- Input with dots showing hidden password -->
  <text x="50" y="48" fill="#374151" font-family="system-ui" font-size="12">••••••</text>

  <!-- Unhelpful error message -->
  <text x="45" y="80" fill="#dc2626" font-family="system-ui" font-size="11">Invalid password</text>

  <!-- User confusion -->
  <text x="250" y="85" fill="#94a3af" font-family="system-ui" font-size="9">What's wrong with it?</text>

  <!-- Frustration indicator -->
  <g transform="translate(290, 45)">
    <circle r="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="12" font-weight="bold">!</text>
  </g>
</svg>