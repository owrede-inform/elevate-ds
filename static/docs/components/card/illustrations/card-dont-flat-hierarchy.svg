<svg width="320" height="180" viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="180" fill="#f8fafc"/>

  <!-- Card container -->
  <rect x="40" y="20" width="240" height="140" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>

  <!-- All content at same visual level - no hierarchy -->
  <text x="60" y="45" fill="#374151" font-family="system-ui" font-size="12">Project Alpha</text>
  <text x="60" y="65" fill="#374151" font-family="system-ui" font-size="12">Status: In Progress</text>
  <text x="60" y="85" fill="#374151" font-family="system-ui" font-size="12">Due: March 15</text>
  <text x="60" y="105" fill="#374151" font-family="system-ui" font-size="12">Backend API development is 80% complete...</text>

  <!-- Button with same visual weight -->
  <rect x="60" y="120" width="80" height="25" rx="4" fill="#6b7280" stroke="#4b5563" stroke-width="1"/>
  <text x="100" y="135" text-anchor="middle" fill="white" font-family="system-ui" font-size="10">View Details</text>

  <!-- Visual indicators showing scanning difficulty -->
  <g transform="translate(290, 50)">
    <path d="M0,0 L0,80" stroke="#ef4444" stroke-width="2" opacity="0.5"/>
    <path d="-3,0 L3,0 M-3,80 L3,80" stroke="#ef4444" stroke-width="2" opacity="0.5"/>
    <text x="10" y="40" fill="#ef4444" font-family="system-ui" font-size="9">Hard to scan</text>
  </g>

  <!-- Bottom indicator -->
  <text x="160" y="175" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="11">All content looks equally important</text>
</svg>