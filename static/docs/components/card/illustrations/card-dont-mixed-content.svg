<svg width="320" height="200" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="200" fill="#f8fafc"/>

  <!-- Card container with mixed, unrelated content -->
  <rect x="40" y="20" width="240" height="160" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Random mix of unrelated information -->
  <text x="60" y="45" fill="#374151" font-family="system-ui" font-size="12" font-weight="600">Account Settings</text>
  <text x="60" y="65" fill="#374151" font-family="system-ui" font-size="11">Weather: 72°F Sunny</text>
  <text x="60" y="85" fill="#374151" font-family="system-ui" font-size="11">Unread Messages: 5</text>
  <text x="60" y="105" fill="#374151" font-family="system-ui" font-size="11">Security: 2FA Enabled</text>
  <text x="60" y="125" fill="#374151" font-family="system-ui" font-size="11">Stock Price: AMZN $145.20</text>
  <text x="60" y="145" fill="#374151" font-family="system-ui" font-size="11">Meeting at 3 PM today</text>

  <!-- Confusion indicators -->
  <g transform="translate(260, 60)">
    <circle r="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="12">?</text>
  </g>

  <g transform="translate(260, 100)">
    <circle r="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="12">?</text>
  </g>

  <!-- Visual connections showing the problem -->
  <path d="M50,65 Q30,85 50,105" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3" fill="none" opacity="0.6"/>
  <path d="M50,125 Q30,135 50,145" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3" fill="none" opacity="0.6"/>

  <!-- Bottom indicator -->
  <text x="160" y="195" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="11">Information doesn't belong together</text>
</svg>