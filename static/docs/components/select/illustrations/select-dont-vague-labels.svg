<svg width="320" height="140" viewBox="0 0 320 140" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="140" fill="#f8fafc"/>

  <!-- Select dropdown with vague options -->
  <rect x="40" y="30" width="240" height="40" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="45" y="25" fill="#374151" font-family="system-ui" font-size="12" font-weight="500">Shipping</text>
  <text x="50" y="53" fill="#9ca3af" font-family="system-ui" font-size="12">Choose option</text>

  <!-- Dropdown arrow -->
  <path d="M270 45 L275 50 L280 45" stroke="#6b7280" stroke-width="1.5" fill="none"/>

  <!-- Dropdown open showing vague options -->
  <rect x="40" y="75" width="240" height="45" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1" fill-opacity="0.95"/>
  <text x="50" y="90" fill="#374151" font-family="system-ui" font-size="11">Option 1</text>
  <text x="50" y="105" fill="#374151" font-family="system-ui" font-size="11">Option 2</text>
  <text x="50" y="120" fill="#374151" font-family="system-ui" font-size="11">Option 3</text>

  <!-- User confusion indicators -->
  <g transform="translate(290, 85)">
    <circle r="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="10">?</text>
  </g>

  <g transform="translate(290, 105)">
    <circle r="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="10">?</text>
  </g>

  <!-- Problem indicator -->
  <text x="160" y="135" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="10">What do these options actually mean?</text>
</svg>