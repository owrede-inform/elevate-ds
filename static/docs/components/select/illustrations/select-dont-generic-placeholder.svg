<svg width="320" height="100" viewBox="0 0 320 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="100" fill="#f8fafc"/>

  <!-- Select with generic, unhelpful placeholder -->
  <rect x="40" y="30" width="240" height="40" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="45" y="25" fill="#374151" font-family="system-ui" font-size="12" font-weight="500">Country</text>
  <text x="50" y="53" fill="#9ca3af" font-family="system-ui" font-size="12">Choose</text>

  <!-- Dropdown arrow -->
  <path d="M270 45 L275 50 L280 45" stroke="#6b7280" stroke-width="1.5" fill="none"/>

  <!-- User confusion - what should they choose? -->
  <g transform="translate(290, 50)">
    <circle r="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="12">?</text>
  </g>

  <!-- Problem indicator -->
  <text x="160" y="90" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="10">Placeholder doesn't help users understand what to select</text>
</svg>