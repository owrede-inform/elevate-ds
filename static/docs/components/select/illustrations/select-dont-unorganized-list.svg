<svg width="320" height="180" viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="180" fill="#f8fafc"/>

  <!-- Long, unorganized dropdown list -->
  <rect x="40" y="20" width="240" height="140" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>

  <!-- Title -->
  <text x="50" y="35" fill="#374151" font-family="system-ui" font-size="11" font-weight="500">Office Location - Choose from 15+ options:</text>

  <!-- Unorganized list mixing regions -->
  <text x="50" y="50" fill="#374151" font-family="system-ui" font-size="10">New York, USA</text>
  <text x="50" y="62" fill="#374151" font-family="system-ui" font-size="10">London, UK</text>
  <text x="50" y="74" fill="#374151" font-family="system-ui" font-size="10">San Francisco, USA</text>
  <text x="50" y="86" fill="#374151" font-family="system-ui" font-size="10">Berlin, Germany</text>
  <text x="50" y="98" fill="#374151" font-family="system-ui" font-size="10">Toronto, Canada</text>
  <text x="50" y="110" fill="#374151" font-family="system-ui" font-size="10">Paris, France</text>
  <text x="50" y="122" fill="#374151" font-family="system-ui" font-size="10">Sydney, Australia</text>
  <text x="50" y="134" fill="#374151" font-family="system-ui" font-size="10">Mexico City, Mexico</text>
  <text x="50" y="146" fill="#374151" font-family="system-ui" font-size="10">Tokyo, Japan</text>

  <!-- Scrollbar indicating more items -->
  <rect x="275" y="25" width="3" height="130" rx="1.5" fill="#e5e7eb"/>
  <rect x="275" y="25" width="3" height="40" rx="1.5" fill="#9ca3af"/>

  <!-- User overwhelm indicator -->
  <g transform="translate(290, 90)">
    <circle r="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="14" font-weight="bold">!</text>
  </g>

  <!-- Problem indicator -->
  <text x="160" y="175" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="10">Too many options without logical grouping</text>
</svg>