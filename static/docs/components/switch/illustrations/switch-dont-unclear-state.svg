<svg width="320" height="100" viewBox="0 0 320 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="100" fill="#f8fafc"/>

  <!-- Unclear switch state with opacity -->
  <rect x="40" y="35" width="30" height="16" rx="8" fill="#e5e7eb" opacity="0.7"/>
  <circle cx="58" cy="43" r="6" fill="#ffffff" opacity="0.7"/>
  <text x="80" y="47" fill="#374151" font-family="system-ui" font-size="12" opacity="0.7">Unknown state</text>

  <!-- Ambiguous visual feedback -->
  <rect x="200" y="35" width="30" height="16" rx="8" fill="#d1d5db"/>
  <circle cx="218" cy="43" r="6" fill="#f3f4f6"/>
  <text x="240" y="47" fill="#9ca3af" font-family="system-ui" font-size="12">Unclear</text>

  <!-- User confusion indicator -->
  <g transform="translate(160, 70)">
    <circle r="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="14" font-weight="bold">!</text>
  </g>

  <!-- Problem indicator -->
  <text x="160" y="90" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="10">Can't tell if switch is on or off</text>
</svg>