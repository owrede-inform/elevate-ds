<svg width="320" height="200" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="200" fill="#f8fafc"/>

  <!-- Well-defined dropzone -->
  <rect x="40" y="40" width="240" height="120" rx="12" fill="#ffffff" stroke="#0066ff" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- Document icon with clear file type indicators -->
  <rect x="140" y="60" width="24" height="30" rx="3" fill="#0066ff" opacity="0.1"/>
  <path d="M157 63 L157 67 L161 67" stroke="#0066ff" stroke-width="1" fill="none"/>
  <rect x="142" y="75" width="20" height="2" rx="1" fill="#0066ff" opacity="0.3"/>
  <rect x="142" y="80" width="15" height="2" rx="1" fill="#0066ff" opacity="0.3"/>
  <rect x="142" y="85" width="18" height="2" rx="1" fill="#0066ff" opacity="0.3"/>

  <!-- Clear title -->
  <text x="160" y="105" text-anchor="middle" fill="#1e293b" font-family="system-ui" font-size="14" font-weight="600">Upload Documents</text>

  <!-- Specific file type requirements -->
  <text x="160" y="125" text-anchor="middle" fill="#475569" font-family="system-ui" font-size="11" font-weight="500">PDF, DOC, DOCX files up to 10MB</text>

  <!-- Clear interaction instructions -->
  <text x="160" y="140" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="11">Drag & drop files or click to browse</text>

  <!-- Visual file type examples -->
  <g transform="translate(80, 170)">
    <rect width="20" height="15" rx="2" fill="#dc2626" opacity="0.1"/>
    <text x="10" y="10" text-anchor="middle" fill="#dc2626" font-family="system-ui" font-size="8" font-weight="bold">PDF</text>
    <text x="10" y="25" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="7">✓</text>
  </g>

  <g transform="translate(110, 170)">
    <rect width="20" height="15" rx="2" fill="#2563eb" opacity="0.1"/>
    <text x="10" y="10" text-anchor="middle" fill="#2563eb" font-family="system-ui" font-size="8" font-weight="bold">DOC</text>
    <text x="10" y="25" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="7">✓</text>
  </g>

  <g transform="translate(140, 170)">
    <rect width="24" height="15" rx="2" fill="#2563eb" opacity="0.1"/>
    <text x="12" y="10" text-anchor="middle" fill="#2563eb" font-family="system-ui" font-size="7" font-weight="bold">DOCX</text>
    <text x="12" y="25" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="7">✓</text>
  </g>

  <g transform="translate(175, 170)">
    <rect width="20" height="15" rx="2" fill="#dc2626" opacity="0.1"/>
    <text x="10" y="10" text-anchor="middle" fill="#dc2626" font-family="system-ui" font-size="8" font-weight="bold">JPG</text>
    <text x="10" y="25" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="7">✗</text>
  </g>

  <!-- Size limitation visual -->
  <g transform="translate(220, 170)">
    <rect width="25" height="15" rx="2" fill="#059669" opacity="0.1"/>
    <text x="12.5" y="10" text-anchor="middle" fill="#059669" font-family="system-ui" font-size="7" font-weight="bold">10MB</text>
    <text x="12.5" y="25" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="7">max</text>
  </g>
</svg>