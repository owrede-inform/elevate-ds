<svg width="320" height="200" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="200" fill="#f8fafc"/>

  <!-- Static dropzone with no feedback -->
  <rect x="40" y="40" width="240" height="120" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Static folder icon - no indication of state change -->
  <path d="M130 70 L130 65 Q130 60 135 60 L145 60 L150 65 L185 65 Q190 65 190 70 L190 105 Q190 110 185 110 L135 110 Q130 110 130 105 Z" fill="#94a3b8" opacity="0.4"/>

  <!-- Generic, unhelpful text -->
  <text x="160" y="130" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="12">Files</text>

  <!-- No status information -->
  <!-- No progress indication -->
  <!-- No clear next steps -->

  <!-- Visual elements showing "nothing happening" -->
  <circle cx="80" cy="170" r="2" fill="#e2e8f0"/>
  <circle cx="90" cy="175" r="2" fill="#e2e8f0"/>
  <circle cx="100" cy="170" r="2" fill="#e2e8f0"/>

  <circle cx="220" cy="175" r="2" fill="#e2e8f0"/>
  <circle cx="230" cy="170" r="2" fill="#e2e8f0"/>
  <circle cx="240" cy="175" r="2" fill="#e2e8f0"/>

  <!-- User confusion indicators -->
  <text x="50" y="30" text-anchor="middle" fill="#cbd5e1" font-family="system-ui" font-size="20" opacity="0.3">?</text>
  <text x="270" y="185" text-anchor="middle" fill="#cbd5e1" font-family="system-ui" font-size="18" opacity="0.3">?</text>

  <!-- Clock icon suggesting waiting/uncertainty -->
  <circle cx="290" cy="50" r="8" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M290 45 L290 50 L293 53" stroke="#cbd5e1" stroke-width="1" fill="none" stroke-linecap="round"/>
</svg>