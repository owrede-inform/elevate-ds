<svg width="320" height="200" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="200" fill="#f8fafc"/>

  <!-- Poorly defined dropzone -->
  <rect x="60" y="60" width="200" height="80" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>

  <!-- Generic, unclear file icon -->
  <rect x="150" y="75" width="16" height="20" rx="2" fill="#9ca3af" opacity="0.5"/>
  <path d="M162 78 L162 82 L166 82" stroke="#9ca3af" stroke-width="1" fill="none"/>

  <!-- Vague, unhelpful text -->
  <text x="160" y="110" text-anchor="middle" fill="#6b7280" font-family="system-ui" font-size="12">Upload files</text>

  <!-- Unclear instruction -->
  <text x="160" y="125" text-anchor="middle" fill="#9ca3af" font-family="system-ui" font-size="10">Select files</text>

  <!-- No specific guidance, confusing elements -->
  <circle cx="100" cy="40" r="3" fill="#d1d5db" opacity="0.5"/>
  <rect x="95" y="30" width="30" height="12" rx="2" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="110" y="38" text-anchor="middle" fill="#9ca3af" font-family="system-ui" font-size="8">Upload</text>

  <circle cx="220" cy="45" r="3" fill="#d1d5db" opacity="0.5"/>
  <rect x="205" y="35" width="25" height="12" rx="2" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="217.5" y="43" text-anchor="middle" fill="#9ca3af" font-family="system-ui" font-size="8">File</text>

  <!-- Scattered, confusing interface elements -->
  <rect x="50" y="160" width="40" height="15" rx="3" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="70" y="170" text-anchor="middle" fill="#9ca3af" font-family="system-ui" font-size="8">Browse</text>

  <rect x="100" y="160" width="35" height="15" rx="3" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="117.5" y="170" text-anchor="middle" fill="#9ca3af" font-family="system-ui" font-size="8">Open</text>

  <rect x="145" y="160" width="30" height="15" rx="3" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="160" y="170" text-anchor="middle" fill="#9ca3af" font-family="system-ui" font-size="8">Add</text>

  <!-- No clear file type guidance - question marks showing confusion -->
  <text x="40" y="190" text-anchor="middle" fill="#d1d5db" font-family="system-ui" font-size="12" opacity="0.6">Any file type?</text>
  <text x="240" y="180" text-anchor="middle" fill="#d1d5db" font-family="system-ui" font-size="11" opacity="0.6">How big?</text>
  <text x="280" y="120" text-anchor="middle" fill="#d1d5db" font-family="system-ui" font-size="14" opacity="0.4">?</text>
</svg>