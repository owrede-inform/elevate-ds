<svg width="320" height="200" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="200" fill="#f8fafc"/>

  <!-- Success state dropzone with clear feedback -->
  <rect x="40" y="40" width="240" height="120" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>

  <!-- Success icon - prominent and clear -->
  <circle cx="160" cy="75" r="16" fill="#22c55e"/>
  <path d="M152 75 L158 81 L168 69" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Clear status message -->
  <text x="160" y="105" text-anchor="middle" fill="#166534" font-family="system-ui" font-size="14" font-weight="600">Files Ready to Upload</text>

  <!-- Specific feedback with numbers -->
  <text x="160" y="125" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="12" font-weight="500">3 documents selected</text>

  <!-- Clear next action -->
  <rect x="120" y="135" width="80" height="20" rx="4" fill="#22c55e"/>
  <text x="160" y="147" text-anchor="middle" fill="white" font-family="system-ui" font-size="11" font-weight="600">Upload Now</text>

  <!-- Visual progress indicator -->
  <rect x="50" y="170" width="220" height="4" rx="2" fill="#dcfce7"/>
  <rect x="50" y="170" width="110" height="4" rx="2" fill="#22c55e"/>

  <!-- File count visualization -->
  <g transform="translate(60, 180)">
    <rect width="12" height="15" rx="2" fill="#22c55e" opacity="0.8"/>
    <rect width="12" height="15" rx="2" fill="#22c55e" opacity="0.8" x="20"/>
    <rect width="12" height="15" rx="2" fill="#22c55e" opacity="0.8" x="40"/>
    <text x="70" y="12" fill="#166534" font-family="system-ui" font-size="10">3 files</text>
  </g>
</svg>