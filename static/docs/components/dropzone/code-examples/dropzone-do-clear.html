<elvt-dropzone
  size="large"
  enable-file-filter
  allowed-file-types='["application/pdf", "application/msword", "application/vnd.openxmlformats-officedocument.wordprocessingml.document"]'>
  <elvt-icon slot="icon" icon="mdi:file-document-outline"></elvt-icon>
  <div slot="title">Upload Documents</div>
  <div slot="description">PDF, DOC, DOCX files up to 10MB<br/>Drag & drop files or click to browse</div>
</elvt-dropzone>
