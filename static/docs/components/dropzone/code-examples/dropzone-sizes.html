<elvt-stack gap="m" direction="horizontal" alignment="start">
  <!-- Small dropzone for minimal layouts -->
  <elvt-dropzone size="small">
    <elvt-icon slot="icon" icon="mdi:cloud-upload-outline"></elvt-icon>
    <div slot="title">Small</div>
    <div slot="description">Compact dropzone</div>
  </elvt-dropzone>

  <!-- Medium dropzone (default) -->
  <elvt-dropzone size="medium">
    <elvt-icon slot="icon" icon="mdi:cloud-upload-outline"></elvt-icon>
    <div slot="title">Medium</div>
    <div slot="description">Default size dropzone</div>
  </elvt-dropzone>

  <!-- Large dropzone for prominent uploads -->
  <elvt-dropzone size="large">
    <elvt-icon slot="icon" icon="mdi:cloud-upload-outline"></elvt-icon>
    <div slot="title">Large</div>
    <div slot="description">Prominent dropzone</div>
  </elvt-dropzone>
</elvt-stack>
