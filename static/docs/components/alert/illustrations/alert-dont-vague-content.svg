<svg width="320" height="120" viewBox="0 0 320 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="120" fill="#f8fafc"/>

  <!-- Alert container with error styling but unhelpful content -->
  <rect x="20" y="30" width="280" height="60" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>

  <!-- Error icon -->
  <circle cx="45" cy="60" r="10" fill="#dc2626"/>
  <path d="M40 55 L50 65 M50 55 L40 65" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- Unhelpful, technical text -->
  <text x="65" y="58" fill="#991b1b" font-family="system-ui" font-size="13" font-weight="500">Error 500: Internal server exception occurred</text>

  <!-- Question marks indicating user confusion -->
  <text x="30" y="110" text-anchor="middle" fill="#cbd5e1" font-family="system-ui" font-size="14" opacity="0.6">?</text>
  <text x="290" y="110" text-anchor="middle" fill="#cbd5e1" font-family="system-ui" font-size="14" opacity="0.6">?</text>

  <!-- Confused user illustration -->
  <text x="160" y="105" text-anchor="middle" fill="#94a3af" font-family="system-ui" font-size="11" opacity="0.7">What does this mean?</text>
</svg>