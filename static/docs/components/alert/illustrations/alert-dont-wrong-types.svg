<svg width="320" height="180" viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="180" fill="#f8fafc"/>

  <!-- Wrong usage: Error styling for welcome message -->
  <rect x="20" y="20" width="280" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <circle cx="45" cy="45" r="8" fill="#dc2626"/>
  <path d="M40 40 L50 50 M50 40 L40 50" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <text x="65" y="48" fill="#991b1b" font-family="system-ui" font-size="12" font-weight="500">Welcome to the application!</text>

  <!-- Wrong usage: Success styling for warning message -->
  <rect x="20" y="85" width="280" height="50" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <circle cx="45" cy="110" r="8" fill="#22c55e"/>
  <path d="M40 110 L44 114 L52 106" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="65" y="113" fill="#166534" font-family="system-ui" font-size="12" font-weight="500">Your account will be deleted soon.</text>

  <!-- Visual confusion indicators -->
  <g transform="translate(290, 35)">
    <circle r="12" fill="#ef4444" opacity="0.1"/>
    <text x="0" y="4" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="16" font-weight="bold">!</text>
  </g>

  <g transform="translate(290, 100)">
    <circle r="12" fill="#ef4444" opacity="0.1"/>
    <text x="0" y="4" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="16" font-weight="bold">!</text>
  </g>

  <!-- Bottom indicator showing the mismatch problem -->
  <text x="160" y="165" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="11">Visual style contradicts message meaning</text>
</svg>