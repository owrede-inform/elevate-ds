<elvt-stack direction="column" spacing="medium">
  <elvt-alert type="info" show-icon>
    This is an informational alert with helpful guidance or context.
  </elvt-alert>
  
  <elvt-alert type="success" show-icon>
    Success! Your changes have been saved successfully.
  </elvt-alert>
  
  <elvt-alert type="warning" show-icon>
    Warning: Your session will expire in 5 minutes.
  </elvt-alert>
  
  <elvt-alert type="error" show-icon>
    Error: Unable to connect to server. Please try again.
  </elvt-alert>
</elvt-stack>
