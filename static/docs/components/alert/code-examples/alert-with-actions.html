<elvt-stack direction="column" spacing="medium">
  <elvt-alert type="info" show-icon>
    New features are available in your dashboard.
    <div slot="actions">
      <elvt-button variant="text" size="small">View Updates</elvt-button>
      <elvt-button variant="text" size="small">Dismiss</elvt-button>
    </div>
  </elvt-alert>
  
  <elvt-alert type="warning" show-icon>
    Your storage space is running low. Upgrade your plan to continue.
    <div slot="actions">
      <elvt-button variant="primary" size="small">Upgrade Now</elvt-button>
      <elvt-button variant="text" size="small">Learn More</elvt-button>
    </div>
  </elvt-alert>
  
  <elvt-alert type="error" show-icon>
    Payment failed. Please update your payment method.
    <div slot="actions">
      <elvt-button variant="primary" size="small">Update Payment</elvt-button>
    </div>
  </elvt-alert>
</elvt-stack>
