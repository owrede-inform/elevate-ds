<elvt-stack direction="column" gap="m">
    <elvt-field>
        <elvt-input
                label="Password"
                type="password"
                placeholder="Enter your password"
        ></elvt-input>
        <elvt-visually-hidden>
            Password must be at least 8 characters long and contain at least one number
        </elvt-visually-hidden>
    </elvt-field>

    <elvt-field>
        <elvt-input
                label="Phone Number"
                type="tel"
                placeholder="(555) 123-4567"
        ></elvt-input>
        <elvt-visually-hidden>
            Format: Area code followed by 7-digit number
        </elvt-visually-hidden>
    </elvt-field>
</elvt-stack>
